<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti 💖</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #ffe4ec;
    transition: 0.5s;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
    margin: auto;
    margin-top: 50px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

input {
    width: 90%;
    padding: 8px;
    margin: 5px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: pink;
    cursor: pointer;
}

img {
    max-width: 100%;
    margin-top: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
    <h2>💖 Para ti 💖</h2>

    <p>¿Tu comida favorita?</p>
    <input id="comida">

    <p>¿Tu color favorito?</p>
    <input id="color">

    <p>¿Tu canción favorita?</p>
    <input id="cancion">

    <br><br>
    <button onclick="guardar()">Guardar 💾</button>

    <h3>🎨 Cambiar fondo</h3>
    <input type="color" onchange="cambiarColor(this.value)">

    <h3>🖼️ Subir imagen</h3>
    <input type="file" onchange="cargarImagen(event)">
    <img id="preview">

</div>

<script>
function guardar() {
    const comida = document.getElementById("comida").value
    const color = document.getElementById("color").value
    const cancion = document.getElementById("cancion").value

    localStorage.setItem("comida", comida)
    localStorage.setItem("color", color)
    localStorage.setItem("cancion", cancion)

    alert("💖 Guardado")
}

function cambiarColor(color) {
    document.body.style.background = color
}

function cargarImagen(event) {
    const img = document.getElementById("preview")
    img.src = URL.createObjectURL(event.target.files[0])
}
</script>

</body>
</html>
